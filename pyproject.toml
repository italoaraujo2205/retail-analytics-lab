[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-analytics-lab"
version = "0.1.0"
description = "Retail analytics, reproducible pipelines and profit-first experimentation"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<3", "scipy>=1.13,<2"]

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]
